<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SupermarketPOS</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div id="app">

        <!-- Header -->
        <header class="app-header">

            <div class="header-content">

                <div class="brand">

                    <div class="brand-icon">
                        🛒
                    </div>

                    <div class="brand-text">

                        <h1>
                            SupermarketPOS
                        </h1>

                        <span>
                            سیستم مدیریت فروشگاه
                        </span>

                    </div>

                </div>

                <div class="header-status">

                    <span class="status-dot"></span>

                    آماده به کار

                </div>

            </div>

        </header>

        <!-- Main -->
        <main>

            <section class="home-screen">

                <!-- Welcome -->
                <div class="welcome-card">

                    <div class="welcome-icon">
                        👋
                    </div>

                    <div>

                        <h2>
                            خوش آمدید
                        </h2>

                        <p>
                            مدیریت فروشگاه را از اینجا شروع کنید.
                        </p>

                    </div>

                </div>

                <!-- Menu -->
                <div class="menu-grid">

                    <button
                        type="button"
                        class="menu-card"
                        data-action="sales"
                    >

                        <div class="menu-icon sales-icon">
                            💳
                        </div>

                        <div class="menu-card-content">

                            <h3>
                                فروش و صندوق
                            </h3>

                            <p>
                                ثبت فروش و مدیریت سبد خرید
                            </p>

                        </div>

                        <div class="menu-arrow">
                            ←
                        </div>

                    </button>

                    <button
                        type="button"
                        class="menu-card"
                        data-action="products"
                    >

                        <div class="menu-icon products-icon">
                            📦
                        </div>

                        <div class="menu-card-content">

                            <h3>
                                کالاها
                            </h3>

                            <p>
                                مدیریت محصولات و موجودی
                            </p>

                        </div>

                        <div class="menu-arrow">
                            ←
                        </div>

                    </button>

                    <button
                        type="button"
                        class="menu-card"
                        data-action="reports"
                    >

                        <div class="menu-icon reports-icon">
                            📊
                        </div>

                        <div class="menu-card-content">

                            <h3>
                                گزارش‌ها
                            </h3>

                            <p>
                                مشاهده فروش و عملکرد فروشگاه
                            </p>

                        </div>

                        <div class="menu-arrow">
                            ←
                        </div>

                    </button>

                    <button
                        type="button"
                        class="menu-card"
                        data-action="settings"
                    >

                        <div class="menu-icon settings-icon">
                            ⚙️
                        </div>

                        <div class="menu-card-content">

                            <h3>
                                تنظیمات
                            </h3>

                            <p>
                                تنظیمات و مدیریت سیستم
                            </p>

                        </div>

                        <div class="menu-arrow">
                            ←
                        </div>

                    </button>

                </div>

            </section>

        </main>

    </div>

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
