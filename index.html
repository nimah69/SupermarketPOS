<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="SupermarketPOS - سیستم مدیریت فروشگاه"
    >

    <title>SupermarketPOS</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

<div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="app-header">

        <div class="header-content">

            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true"
                >
                    🛒
                </div>

                <div class="brand-text">

                    <h1>
                        SupermarketPOS
                    </h1>

                    <span>
                        سیستم مدیریت فروشگاه
                    </span>

                </div>

            </div>


            <div class="header-status">

                <div
                    class="status-badge status-ready"
                    aria-label="وضعیت سیستم"
                >

                    <span
                        class="status-icon"
                        aria-hidden="true"
                    >
                        ✓
                    </span>

                    <div class="status-info">

                        <span class="status-label">
                            وضعیت
                        </span>

                        <strong>
                            آماده به کار
                        </strong>

                    </div>

                </div>


                <div
                    class="status-badge status-online"
                    aria-label="وضعیت اتصال"
                >

                    <span
                        class="status-icon"
                        aria-hidden="true"
                    >
                        ●
                    </span>

                    <div class="status-info">

                        <span class="status-label">
                            اتصال
                        </span>

                        <strong>
                            محلی
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <section class="home-screen">

            <div class="welcome-card">

                <div
                    class="welcome-icon"
                    aria-hidden="true"
                >
                    👋
                </div>

                <div>

                    <h2>
                        خوش آمدید
                    </h2>

                    <p>
                        مدیریت فروشگاه را از اینجا شروع کنید.
                    </p>

                </div>

            </div>


            <div class="menu-grid">


                <button
                    type="button"
                    class="menu-card"
                    data-action="sales"
                    aria-label="ورود به بخش فروش و صندوق"
                >

                    <div
                        class="menu-icon sales-icon"
                        aria-hidden="true"
                    >
                        💳
                    </div>

                    <div class="menu-card-content">

                        <h3>
                            فروش و صندوق
                        </h3>

                        <p>
                            ثبت فروش و مدیریت سبد خرید
                        </p>

                    </div>

                    <div
                        class="menu-arrow"
                        aria-hidden="true"
                    >
                        ←
                    </div>

                </button>


                <button
                    type="button"
                    class="menu-card"
                    data-action="products"
                    aria-label="ورود به بخش کالاها"
                >

                    <div
                        class="menu-icon products-icon"
                        aria-hidden="true"
                    >
                        📦
                    </div>

                    <div class="menu-card-content">

                        <h3>
                            کالاها
                        </h3>

                        <p>
                            مدیریت محصولات و موجودی
                        </p>

                    </div>

                    <div
                        class="menu-arrow"
                        aria-hidden="true"
                    >
                        ←
                    </div>

                </button>


                <button
                    type="button"
                    class="menu-card"
                    data-action="reports"
                    aria-label="ورود به گزارش‌ها"
                >

                    <div
                        class="menu-icon reports-icon"
                        aria-hidden="true"
                    >
                        📊
                    </div>

                    <div class="menu-card-content">

                        <h3>
                            گزارش‌ها
                        </h3>

                        <p>
                            مشاهده فروش و عملکرد فروشگاه
                        </p>

                    </div>

                    <div
                        class="menu-arrow"
                        aria-hidden="true"
                    >
                        ←
                    </div>

                </button>


                <button
                    type="button"
                    class="menu-card"
                    data-action="settings"
                    aria-label="ورود به تنظیمات"
                >

                    <div
                        class="menu-icon settings-icon"
                        aria-hidden="true"
                    >
                        ⚙️
                    </div>

                    <div class="menu-card-content">

                        <h3>
                            تنظیمات
                        </h3>

                        <p>
                            تنظیمات و مدیریت سیستم
                        </p>

                    </div>

                    <div
                        class="menu-arrow"
                        aria-hidden="true"
                    >
                        ←
                    </div>

                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         TOAST
         
         هیچ Modal یا کادر تأیید در HTML اولیه وجود ندارد.
         Modal فقط در صورت نیاز توسط app.js ساخته می‌شود.
    ====================================================== -->

    <div
        id="app-toast"
        class="app-toast"
        aria-live="polite"
        aria-atomic="true"
    ></div>

</div>


<script
    type="module"
    src="./js/app.js"
></script>

</body>

</html>
